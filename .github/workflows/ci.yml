name: Deploy to GCP VM
on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 3. Deploy to VM
      - name: Deploy to VM
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Ensure the app folder exists
            if [ ! -d "/home/soumyajaiswal7708/app" ]; then
              git clone https://github.com/${{ github.repository }} /home/soumyajaiswal7708/app
            fi

            cd /home/soumyajaiswal7708/app

            # Pull latest changes
            git reset --hard
            git clean -fd
            git pull origin main

            # Install dependencies
            npm ci --legacy-peer-deps

            # Build Next.js
            npm run build

            # Start or restart the app using PM2 in the correct folder
            pm2 delete nextapp 2>/dev/null
            pm2 start npm --name "nextapp" -- run start -- cwd /home/soumyajaiswal7708/app
            pm2 save
          EOF
