name: Build and Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Node for building
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install and build Next.js app
      - name: Install and Build
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm prune --production  # remove dev deps to reduce upload size

      # 4. Prepare build artifact (only send necessary files)
      # 4. Prepare build artifact (only send necessary files)
      - name: Prepare deployment bundle
        run: |
          mkdir deploy
          cp -r .next package.json public deploy/
          if [ -f next.config.js ]; then cp next.config.js deploy/; fi
          if [ -f ecosystem.config.js ]; then cp ecosystem.config.js deploy/; fi

      # 5. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 6. Deploy built files to VM
      - name: Upload build to VM
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -avz --delete \
            ./deploy/ \
            $SERVER_USER@$SERVER_IP:/home/$SERVER_USER/app/

      # 7. Restart PM2 process on VM
      - name: Restart PM2 on VM
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
            cd /home/$USER/app
            npm install --omit=dev --legacy-peer-deps
            pm2 restart nextapp || pm2 start npm --name "nextapp" -- start
          EOF
