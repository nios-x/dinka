  <g transform="translate(16 16) scale(0.66) translate(-16 -16)">
    <path d="M16 3.2a12.8 12.8 0 1 1-9.05 3.75" stroke="#17130f" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="16" r="4.6" fill="#17130f"/>
  </g>
</svg>
