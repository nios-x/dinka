<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Dinka">
  <title>Dinka</title>
  <!-- Maskable: the mark is scaled into the safe zone (the middle 80%) so a
       platform cropping this to a circle or a squircle never clips it. -->
